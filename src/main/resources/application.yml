spring:
  application:
    name: RateAnalysis
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/rate_analysis}
    username: ${DB_USERNAME:n8n}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      naming:
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1

logging:
  level:
    root: INFO
    com.myapp: DEBUG
  file:
    name: app.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"

ranalysis:
  batchsize: 50
  eltFilePath: /data/rates
  eltFileNameFormat: Rate_{{DATE}}.csv
  notifyWebhookUrl: ${NOTIFY_WEBHOOK_URL:http://n8n:5678/webhook/notify}
  smileyApiUrl: ${SMILEY_API_URL:http://smiley-api:3100}
  smileyInternalKey: ${SMILEY_INTERNAL_KEY:}
  symbols:
    - name: SGDMYR
      type: CURRENCY
      url: ""
      rateRegex: ""
      watcher:
        enabled: true
        hourlyWindow: 24
        dailyWindow: 30
        highThreshold: 1.02
        lowThreshold: 0.98
